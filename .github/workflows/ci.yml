name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Placeholder public values. The build and the signed-out browser tests need
# these variables but make no call to Microsoft Entra ID with them.
env:
  NEXT_PUBLIC_MSAL_CLIENT_ID: 00000000-0000-0000-0000-000000000000
  NEXT_PUBLIC_MSAL_AUTHORITY: https://login.microsoftonline.com/common
  NEXT_PUBLIC_MSAL_REDIRECT_URI: http://127.0.0.1:3100
  NEXT_PUBLIC_SITE_URL: https://www.intunehydrationkit.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Type-check, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  e2e:
    name: Signed-out browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Specs that need a signed-in tenant skip themselves unless
      # RUN_MANUAL_E2E=1 is set.
      - name: Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
